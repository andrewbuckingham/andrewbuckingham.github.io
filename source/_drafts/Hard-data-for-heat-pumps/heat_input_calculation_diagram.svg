<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 26px; font-weight: bold; fill: #333; }
      .step-title { font-size: 16px; font-weight: bold; fill: #fff; }
      .label { font-size: 14px; fill: #333; }
      .data-box { font-size: 14px; fill: #333; font-family: monospace; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .section-bg { fill: #f9f9f9; stroke: #ccc; stroke-width: 1; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="35" class="title" text-anchor="middle">Heat Input Calculation Per Room</text>

  <!-- ===== STEP 1: TOTAL GAS POWER ===== -->
  <g id="step1">
    <!-- Background -->
    <rect x="30" y="70" width="280" height="200" class="section-bg" rx="8"/>
    
    <!-- Step number -->
    <circle cx="60" cy="100" r="20" fill="#2196F3" stroke="none"/>
    <text x="60" y="108" class="step-title" text-anchor="middle">1</text>
    
    <!-- Title -->
    <text x="160" y="105" class="label" font-weight="bold" fill="#2196F3">Total Gas Power Input</text>
    
    <!-- Icon - Boiler -->
    <rect x="100" y="130" width="120" height="60" fill="#ff6b6b" stroke="#333" stroke-width="2" rx="4"/>
    <text x="160" y="165" class="data-box" text-anchor="middle">Boiler</text>
    
    <!-- Smart meter reading -->
    <text x="50" y="210" class="label">From smart gas meter:</text>
    <rect x="50" y="215" width="240" height="35" fill="#fff" stroke="#2196F3" stroke-width="2" rx="3"/>
    <text x="160" y="238" class="data-box" text-anchor="middle" fill="#2196F3" font-weight="bold">Total Power = 8 kW</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 310 170 L 380 170" class="arrow"/>

  <!-- ===== STEP 2: PRO-RATA BY TRV POSITION ===== -->
  <g id="step2">
    <!-- Background -->
    <rect x="380" y="70" width="340" height="200" class="section-bg" rx="8"/>
    
    <!-- Step number -->
    <circle cx="410" cy="100" r="20" fill="#4CAF50" stroke="none"/>
    <text x="410" y="108" class="step-title" text-anchor="middle">2</text>
    
    <!-- Title -->
    <text x="520" y="105" class="label" font-weight="bold" fill="#4CAF50">Allocate by TRV % Open</text>
    
    <!-- Three room examples -->
    <g id="room1">
      <text x="395" y="135" class="label" font-weight="bold">Bedroom</text>
      <rect x="395" y="140" width="90" height="20" fill="#ddd" stroke="#333" stroke-width="1" rx="2"/>
      <rect x="395" y="140" width="45" height="20" fill="#4CAF50" stroke="#333" stroke-width="1" rx="2"/>
      <text x="442" y="154" class="data-box" text-anchor="middle">50%</text>
      <text x="442" y="175" class="data-box" text-anchor="middle" fill="#4CAF50" font-weight="bold">4.0 kW</text>
    </g>
    
    <g id="room2">
      <text x="520" y="135" class="label" font-weight="bold">Living Room</text>
      <rect x="520" y="140" width="90" height="20" fill="#ddd" stroke="#333" stroke-width="1" rx="2"/>
      <rect x="520" y="140" width="72" height="20" fill="#4CAF50" stroke="#333" stroke-width="1" rx="2"/>
      <text x="567" y="154" class="data-box" text-anchor="middle">80%</text>
      <text x="567" y="175" class="data-box" text-anchor="middle" fill="#4CAF50" font-weight="bold">6.4 kW</text>
    </g>
    
    <g id="room3">
      <text x="645" y="135" class="label" font-weight="bold">Kitchen</text>
      <rect x="645" y="140" width="90" height="20" fill="#ddd" stroke="#333" stroke-width="1" rx="2"/>
      <rect x="645" y="140" width="27" height="20" fill="#4CAF50" stroke="#333" stroke-width="1" rx="2"/>
      <text x="692" y="154" class="data-box" text-anchor="middle">30%</text>
      <text x="692" y="175" class="data-box" text-anchor="middle" fill="#4CAF50" font-weight="bold">2.4 kW</text>
    </g>
    
    <!-- Formula -->
    <rect x="395" y="195" width="340" height="40" fill="#fff" stroke="#4CAF50" stroke-width="2" rx="3"/>
    <text x="565" y="218" class="data-box" text-anchor="middle" fill="#4CAF50" font-weight="bold">Power per room = Total Power × (TRV % / 100%)</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 720 170 L 790 170" class="arrow"/>

  <!-- ===== STEP 3: ADJUST FOR RADIATOR vs ROOM TEMP ===== -->
  <g id="step3">
    <!-- Background -->
    <rect x="790" y="70" width="580" height="200" class="section-bg" rx="8"/>
    
    <!-- Step number -->
    <circle cx="820" cy="100" r="20" fill="#FF9800" stroke="none"/>
    <text x="820" y="108" class="step-title" text-anchor="middle">3</text>
    
    <!-- Title -->
    <text x="1080" y="105" class="label" font-weight="bold" fill="#FF9800">Adjust by Temperature Difference</text>
    
    <!-- Three room examples with temperature data -->
    <g id="temp1">
      <text x="805" y="135" class="label" font-weight="bold">Bedroom</text>
      <rect x="805" y="140" width="160" height="55" fill="#fff" stroke="#FF9800" stroke-width="1" rx="3"/>
      <text x="815" y="158" class="data-box">Radiator: 70°C</text>
      <text x="815" y="175" class="data-box">Room Air: 19°C</text>
      <text x="815" y="192" class="data-box" fill="#FF9800" font-weight="bold">ΔT = 51°C</text>
    </g>
    
    <g id="temp2">
      <text x="1005" y="135" class="label" font-weight="bold">Living Room</text>
      <rect x="1005" y="140" width="160" height="55" fill="#fff" stroke="#FF9800" stroke-width="1" rx="3"/>
      <text x="1015" y="158" class="data-box">Radiator: 70°C</text>
      <text x="1015" y="175" class="data-box">Room Air: 21°C</text>
      <text x="1015" y="192" class="data-box" fill="#FF9800" font-weight="bold">ΔT = 49°C</text>
    </g>
    
    <g id="temp3">
      <text x="1205" y="135" class="label" font-weight="bold">Kitchen</text>
      <rect x="1205" y="140" width="160" height="55" fill="#fff" stroke="#FF9800" stroke-width="1" rx="3"/>
      <text x="1215" y="158" class="data-box">Radiator: 70°C</text>
      <text x="1215" y="175" class="data-box">Room Air: 22°C</text>
      <text x="1215" y="192" class="data-box" fill="#FF9800" font-weight="bold">ΔT = 48°C</text>
    </g>
    
    <!-- Formula -->
    <rect x="805" y="205" width="560" height="50" fill="#fff" stroke="#FF9800" stroke-width="2" rx="3"/>
    <text x="1085" y="225" class="data-box" text-anchor="middle" fill="#FF9800" font-weight="bold">Heat Input = Allocated Power × (Room ΔT / Reference ΔT)</text>
    <text x="1085" y="244" class="label" text-anchor="middle" font-size="12" fill="#666">Higher ΔT = more heat flowing into room; Lower ΔT = less heat needed</text>
  </g>

  <!-- ===== BOTTOM: FINAL RESULTS ===== -->
  <g id="results">
    <!-- Background -->
    <rect x="30" y="310" width="1340" height="440" fill="#f0f7ff" stroke="#2196F3" stroke-width="2" rx="8"/>
    
    <!-- Title -->
    <text x="700" y="345" class="title" text-anchor="middle">Final Heat Input Per Room</text>

    <!-- Room 1: Bedroom -->
    <g id="result1">
      <rect x="50" y="370" width="410" height="350" fill="#fff" stroke="#2196F3" stroke-width="2" rx="6"/>
      
      <text x="255" y="400" class="label" font-weight="bold" text-anchor="middle" fill="#2196F3">Bedroom</text>
      
      <!-- Step by step calculation -->
      <text x="70" y="435" class="label">1. Base allocation (50% of 8 kW):</text>
      <text x="90" y="455" class="data-box">= 8 × 0.50 = 4.0 kW</text>
      
      <text x="70" y="485" class="label">2. Temperature adjustment:</text>
      <text x="90" y="505" class="data-box">ΔT = 70°C − 19°C = 51°C</text>
      <text x="90" y="525" class="data-box">Adjustment ratio = 51°C / 50°C = 1.02</text>
      
      <text x="70" y="555" class="label">3. Final heat input:</text>
      <rect x="70" y="560" width="360" height="35" fill="#e3f2fd" stroke="#2196F3" stroke-width="2" rx="3"/>
      <text x="250" y="583" class="data-box" text-anchor="middle" fill="#2196F3" font-weight="bold">4.0 kW × 1.02 = 4.08 kW</text>
    </g>

    <!-- Room 2: Living Room -->
    <g id="result2">
      <rect x="495" y="370" width="410" height="350" fill="#fff" stroke="#4CAF50" stroke-width="2" rx="6"/>
      
      <text x="700" y="400" class="label" font-weight="bold" text-anchor="middle" fill="#4CAF50">Living Room</text>
      
      <!-- Step by step calculation -->
      <text x="515" y="435" class="label">1. Base allocation (80% of 8 kW):</text>
      <text x="535" y="455" class="data-box">= 8 × 0.80 = 6.4 kW</text>
      
      <text x="515" y="485" class="label">2. Temperature adjustment:</text>
      <text x="535" y="505" class="data-box">ΔT = 70°C − 21°C = 49°C</text>
      <text x="535" y="525" class="data-box">Adjustment ratio = 49°C / 50°C = 0.98</text>
      
      <text x="515" y="555" class="label">3. Final heat input:</text>
      <rect x="515" y="560" width="360" height="35" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2" rx="3"/>
      <text x="695" y="583" class="data-box" text-anchor="middle" fill="#4CAF50" font-weight="bold">6.4 kW × 0.98 = 6.27 kW</text>
    </g>

    <!-- Room 3: Kitchen -->
    <g id="result3">
      <rect x="940" y="370" width="410" height="350" fill="#fff" stroke="#FF9800" stroke-width="2" rx="6"/>
      
      <text x="1145" y="400" class="label" font-weight="bold" text-anchor="middle" fill="#FF9800">Kitchen</text>
      
      <!-- Step by step calculation -->
      <text x="960" y="435" class="label">1. Base allocation (30% of 8 kW):</text>
      <text x="980" y="455" class="data-box">= 8 × 0.30 = 2.4 kW</text>
      
      <text x="960" y="485" class="label">2. Temperature adjustment:</text>
      <text x="980" y="505" class="data-box">ΔT = 70°C − 22°C = 48°C</text>
      <text x="980" y="525" class="data-box">Adjustment ratio = 48°C / 50°C = 0.96</text>
      
      <text x="960" y="555" class="label">3. Final heat input:</text>
      <rect x="960" y="560" width="360" height="35" fill="#fff3e0" stroke="#FF9800" stroke-width="2" rx="3"/>
      <text x="1140" y="583" class="data-box" text-anchor="middle" fill="#FF9800" font-weight="bold">2.4 kW × 0.96 = 2.30 kW</text>
    </g>

    <!-- Key insight at bottom -->
    <rect x="50" y="735" width="1340" height="50" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" rx="4"/>
    <text x="720" y="760" class="label" text-anchor="middle" font-weight="bold">Each room's heat input adapts in real-time based on its current demand (temperature gap) and radiator availability (TRV position)</text>
  </g>

</svg>